<meta charset="UTF-8">
<title>도착</title>
<link rel="stylesheet" href="style.css">

<div class="screen center">
  <div class="card">
    <div class="card-header">도착</div>
    <div class="card-body center">
      <div class="brand-icon">✅</div>
      <h1>목적지에 도착했습니다</h1>
      <div class="action-row">
        <button id="return-btn" class="big-btn primary">
          <span class="icon">🏠</span>
          <span class="label"><span class="label-main">반납</span><span class="label-sub">Return to Start</span></span>
        </button>
        <button id="wait-btn" class="big-btn neutral">
          <span class="icon">⏸️</span>
          <span class="label"><span class="label-main">대기</span><span class="label-sub">Wait Here</span></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/roslib.min.js"></script>
<script src="ros-connection.js"></script>
<script>
  WheelchairUi.connect(function (ros) {
    document.getElementById('return-btn').addEventListener('click', function () {
      WheelchairUi.publish(ros, '/ui/return_to_start', 'std_msgs/Bool', { data: true });
      window.location.href = 'navigating.html';
    });
    document.getElementById('wait-btn').addEventListener('click', function () {
      WheelchairUi.publish(ros, '/ui/set_manual_mode', 'std_msgs/Bool', { data: true });
      window.location.href = 'manual.html';
    });
  });
</script>
